[package]
name = "hush"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "GitHub notifications for your desktop"
license = "MIT"
default-run = "hush"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:tray-icon", "dep:gio"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
fs2 = "0.4"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
notify-rust = "=4.18.1"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
webbrowser = "1.0"
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
gio = { version = "=0.18.4", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "=0.21.3", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "hush"
path = "src/main.rs"
