[package]
name = "hush"
# Local development version; release builds replace this from the Git tag.
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "GitHub notifications for your desktop"
license = "MIT"
default-run = "hush"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:wgpu", "dep:tray-icon", "dep:gio"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
fs2 = "0.4"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
notify-rust = "=4.18.1"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sys-locale = "=0.3.2"
thiserror = "2.0"
url = "2.5"
webbrowser = "1.0"
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
gio = { version = "=0.18.4", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "=0.21.3", optional = true, default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["default_fonts", "wgpu_no_default_features", "accesskit"] }
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "dx12", "wgsl"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "hush"
path = "src/main.rs"

[[test]]
name = "windows_graphics"
harness = false
required-features = ["desktop"]

[[test]]
name = "worker_lifecycle"
harness = false
