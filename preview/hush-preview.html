<div class="preview-info"><span>HUSH / INTERAKTIVE DESIGNVORSCHAU</span><span>Offline-Demodaten · kein nativer App-Screenshot · keine GitHub-Verbindung</span></div>
<div class="window">
<aside class="sidebar"><div class="brand"><div class="mark"><svg><use href="#i-mark"/></svg></div><div><div class="brand-name">hush</div><div class="brand-tag">GITHUB</div></div></div>
<nav class="navigation" aria-label="Navigation"><button class="nav active" data-page="inbox"><svg><use href="#i-inbox"/></svg><span>Posteingang</span><span class="badge" id="inbox-count">4</span></button><button class="nav" data-page="archive"><svg><use href="#i-archive"/></svg><span>Erledigt</span></button><div class="nav-label">BENACHRICHTIGUNGEN</div>
<button class="nav" data-kind="request"><svg><use href="#i-request"/></svg><span>PR-Anfragen</span><span class="badge" data-count="request">1</span></button><button class="nav" data-kind="issue"><svg><use href="#i-issue"/></svg><span>Neue Issues</span><span class="badge" data-count="issue">1</span></button><button class="nav" data-kind="review"><svg><use href="#i-review"/></svg><span>PR-Reviews</span><span class="badge" data-count="review">1</span></button><button class="nav" data-kind="mention"><svg><use href="#i-mention"/></svg><span>Erwähnungen</span><span class="badge" data-count="mention">1</span></button></nav>
<div class="side-bottom"><button class="nav" data-page="settings"><svg><use href="#i-settings"/></svg><span>Einstellungen</span></button><div class="account"><div class="avatar">a</div><div><b>@alex</b><small>GitHub · Demokonto</small></div><span class="dot"></span></div></div></aside>
<div class="workspace"><header class="topbar"><span class="breadcrumb">GITHUB</span><div class="tools"><span class="status"><i class="dot"></i><span id="status-label">Demomodus</span></span><button class="iconbutton" id="refresh" aria-label="Aktualisieren" title="Aktualisieren"><svg><use href="#i-refresh"/></svg></button><button class="iconbutton" id="pause" aria-label="30 Minuten pausieren" title="30 Minuten pausieren"><svg><use href="#i-pause"/></svg></button><span class="divider-v"></span><button class="iconbutton" id="theme" aria-label="Erscheinungsbild wechseln" title="Erscheinungsbild wechseln"><svg><use href="#i-sun"/></svg></button></div></header><main class="content" id="content"></main></div></div>
<div class="toast" id="toast" role="status"><svg><use href="#i-check"/></svg><span></span></div>
<script>
'use strict';
const events=[
{id:1,kind:'request',title:'A calmer command palette',repo:'atelier/design-system',actor:'mara',time:'vor 4 Min.',num:284,day:'HEUTE',unread:true,detail:'Das Team atelier/frontend wurde um ein Review gebeten.\n\nNeue Tastatur-Navigation, weniger visuelles Rauschen und ein konsistenter Fokuszustand.'},
{id:2,kind:'mention',title:'Keyboard navigation in the issue list',repo:'atelier/web',actor:'jonas',time:'vor 18 Min.',num:137,day:'HEUTE',unread:true,detail:'@alex, könntest du dir das Fokusverhalten unter Wayland ansehen?\n\nMit Tab bleibt der Fokus nach dem Schließen des Dialogs noch im Overlay.'},
{id:3,kind:'review',title:'Refine the notification preferences',repo:'atelier/desktop',actor:'lea',time:'vor 42 Min.',num:92,day:'HEUTE',unread:true,detail:'Freigegeben.\n\nDie neuen Voreinstellungen sind deutlich verständlicher. Besonders gut: keine privaten Inhalte auf dem Sperrbildschirm.'},
{id:4,kind:'issue',title:'Support fractional scaling on Wayland',repo:'atelier/design-system',actor:'sam',time:'vor 1 Std.',num:289,day:'HEUTE',unread:true,detail:'Bei einer Skalierung von 125 % sollten Icons und Trennlinien auf demselben Pixelraster liegen.\n\nBeobachtet unter Niri.'},
{id:5,kind:'mention',title:'Unify spacing tokens across components',repo:'atelier/design-system',actor:'mara',time:'vor 2 Std.',num:271,day:'HEUTE',unread:false,detail:'@alex, die Abstände sind jetzt auf das gemeinsame 4-Pixel-Raster umgestellt. Was hältst du von der kompakteren Variante?'},
{id:6,kind:'review',title:'Keep notification content private by default',repo:'atelier/desktop',actor:'jonas',time:'vor 2 Std.',num:86,day:'HEUTE',unread:false,detail:'Änderungen angefragt.\n\nBitte die Vorschau beim ersten Start ausgeschaltet lassen. Repository-Namen können bereits vertraulich sein.'},
{id:7,kind:'issue',title:'Preserve scroll position after filtering',repo:'atelier/web',actor:'lea',time:'Gestern',num:130,day:'GESTERN',unread:false,detail:'Beim Wechsel des Filters springt die Liste nach oben. Die bisherige Leseposition sollte erhalten bleiben.'},
{id:8,kind:'request',title:'Extract reusable empty states',repo:'atelier/design-system',actor:'sam',time:'Gestern',num:265,day:'GESTERN',unread:false,detail:'Dir wurde dieser Pull Request zugewiesen.'}
];
const kinds={request:'PR-Anfrage',issue:'Neues Issue',review:'Review erhalten',mention:'Du wurdest erwähnt'};
const titles={request:'Reviews & Zuweisungen',issue:'Neue Issues',review:'Deine PR-Reviews',mention:'Erwähnungen'};
let state={page:'inbox',kind:null,unread:false,query:'',selected:null,paused:false,rules:{request:true,issue:true,review:true,mention:true},desktop:true,preview:false,interval:120,repos:'atelier/design-system\natelier/web'};
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(i,cls='')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${i}"/></svg>`;
function toast(text){$('#toast span').textContent=text;$('#toast').classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('visible'),3500)}
function navState(){
 $$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.kind?state.page==='inbox'&&state.kind===b.dataset.kind:state.page===b.dataset.page&&(state.page!=='inbox'||!state.kind)));
 $('#inbox-count').textContent=events.filter(e=>e.unread&&!e.archived).length;
 $$('[data-count]').forEach(b=>{let n=events.filter(e=>e.kind===b.dataset.count&&e.unread&&!e.archived).length;b.textContent=n||''});
 $('#status-label').textContent=state.paused?'30 Min. pausiert':'Demomodus';$('#pause use').setAttribute('href',state.paused?'#i-play':'#i-pause');
}
function orbit(){return `<div class="orbit" aria-hidden="true">${icon('mark')}<i></i></div>`}
function visibleEvents(){return events.filter(e=>!!e.archived===(state.page==='archive')&&(!state.kind||state.kind===e.kind)&&(!state.unread||e.unread)&&[e.title,e.repo,e.actor,e.detail].join(' ').toLowerCase().includes(state.query.toLowerCase()))}
function cards(){let date='';const rows=visibleEvents();if(!rows.length)return `<div class="empty">${orbit()}<h2>${state.query?'Keine Treffer':'Keine Benachrichtigungen'}</h2><p>${state.query?'Versuche einen anderen Namen oder ein Repository.':'Neue Benachrichtigungen erscheinen hier.'}</p></div>`;
return rows.map(e=>{let label=e.day!==date?`<div class="date-label">${e.day}</div>`:'';date=e.day;return label+`<button class="card ${e.unread?'':'read'} ${state.selected===e.id?'selected':''}" data-event="${e.id}" aria-label="${esc(kinds[e.kind]+': '+e.title)}"><div class="card-top ${e.kind}"><span class="type-icon">${icon(e.kind)}</span><span>${kinds[e.kind]}</span><span class="card-time">${e.time}</span>${e.unread?'<i class="unread-dot"></i>':''}</div><div class="card-title">${esc(e.title)}</div><div class="card-meta">${icon('repo')}<span class="repo">${esc(e.repo)}</span><i class="tinysep"></i><span>@${esc(e.actor)}</span><span class="number">#${e.num}</span></div></button>`}).join('')}
function bindCards(){$$('[data-event]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.event;events.find(e=>e.id===state.selected).unread=false;render()})}
function render(){navState();if(state.page==='settings'){renderSettings();return}const selected=events.find(e=>e.id===state.selected);$('#content').className='content'+(selected?' with-detail':'');
const total=events.filter(e=>!!e.archived===(state.page==='archive')&&(!state.kind||state.kind===e.kind)).length;
const unread=events.filter(e=>!!e.archived===(state.page==='archive')&&e.unread&&(!state.kind||state.kind===e.kind)).length;
$('#content').innerHTML=`<section class="inbox">${state.paused?`<div class="quiet-banner">${icon('pause')}Desktop-Benachrichtigungen sind für 30 Minuten pausiert.</div>`:''}<div class="intro"><div><h1>${state.page==='archive'?'Erledigt':state.kind?titles[state.kind]:'Posteingang'}</h1><p class="subtitle">${state.page==='archive'?'Lokal erledigte Benachrichtigungen.':''}</p></div>${orbit()}</div><div class="filterbar"><div class="tabs" role="group" aria-label="Lesestatus"><button class="tab ${!state.unread?'on':''}" data-tab="all">Alle <span>${total}</span></button><button class="tab ${state.unread?'on':''}" data-tab="unread">Ungelesen <span>${unread}</span></button></div><label class="search">${icon('search')}<input id="search" aria-label="Benachrichtigungen durchsuchen" placeholder="Benachrichtigungen durchsuchen" value="${esc(state.query)}"><kbd>⌘ K</kbd></label></div><div class="list-meta"><span>BENACHRICHTIGUNGEN</span><button class="textbutton" id="read-all">${icon('check')}Alles gelesen</button></div><div class="list" id="list">${cards()}</div><div class="footer"><span class="right">OFFLINE-DEMO <span style="padding:0 6px">·</span> 8 Beispielereignisse</span></div></section>${selected?detailHTML(selected):''}`;
bindCards();$$('[data-tab]').forEach(b=>b.onclick=()=>{state.unread=b.dataset.tab==='unread';state.selected=null;render()});$('#search').oninput=e=>{state.query=e.target.value;$('#list').innerHTML=cards();bindCards()};$('#read-all').onclick=()=>{events.forEach(e=>e.unread=false);render();toast('Alle Benachrichtigungen als gelesen markiert.')};
if(selected){$('#detail-close').onclick=()=>{state.selected=null;render()};$('#archive-event').onclick=()=>{selected.archived=!selected.archived;state.selected=null;render();toast(selected.archived?'Lokal erledigt. Auf GitHub wurde nichts verändert.':'Zurück im Posteingang.')};$('#open-github').onclick=()=>toast('Designvorschau: Der native Client öffnet hier den echten GitHub-Link.');}
}
function detailHTML(e){return `<aside class="detail" aria-label="Ereignisdetails"><div class="detail-top">DETAILS<button class="iconbutton" id="detail-close" aria-label="Details schließen">${icon('close')}</button></div><div class="detail-type ${e.kind}"><div class="type-icon">${icon(e.kind)}</div><div class="kind-label">${kinds[e.kind]}</div></div><h2>${esc(e.title)}</h2><div class="detail-repo">${esc(e.repo)} <span style="color:var(--faint)">#${e.num}</span></div><div class="detail-person">@${esc(e.actor)} · ${e.time}</div><div class="quote">${esc(e.detail)}</div><div class="detail-buttons"><button class="btn primary" id="open-github">Auf GitHub öffnen ${icon('arrow')}</button><button class="btn" id="archive-event">${icon(e.archived?'inbox':'check')}${e.archived?'Zurück in den Posteingang':'Erledigen'}</button><p class="detail-note">Erledigen ändert nur deine lokale Inbox.<br>Dein GitHub-Posteingang bleibt unverändert.</p></div></aside>`}
const descriptions={request:'Zuweisungen an dich. Review-Anfragen an dich oder dein Team.',issue:'Nur neue Issues in den Repositories, die du unten auswählst.',review:'Freigaben, Änderungswünsche und Kommentare in eingereichten Reviews.',mention:'Neue @Erwähnungen, nicht jeder folgende Kommentar im Thread.'};
function switchHTML(key,on,label){return `<button class="switch" data-switch="${key}" role="switch" aria-checked="${on}" aria-label="${esc(label)}"></button>`}
function settingRow(title,help,key,on,ico=''){return `<div class="setting-row">${ico?`<div class="setting-symbol">${icon(ico)}</div>`:''}<div class="setting-copy"><strong>${title}</strong><small>${help}</small></div>${switchHTML(key,on,title)}</div>`}
function renderSettings(){
$('#content').className='content';$('#content').innerHTML=`<section class="settings"><div class="settings-body"><h1>Einstellungen</h1><div class="settings-section"><h3>BENACHRICHTIGUNGSARTEN</h3><div class="setting-group">${Object.keys(kinds).map(k=>settingRow(titles[k],descriptions[k],k,state.rules[k],k)).join('')}</div></div><div class="settings-section"><h3>ISSUE-REPOSITORIES</h3><textarea class="repo-input" id="repos" aria-label="Issue-Repositories" spellcheck="false">${esc(state.repos)}</textarea><p class="help">Ein Repository pro Zeile: organisation/repository</p></div><div class="settings-section"><h3>DESKTOP-BENACHRICHTIGUNGEN</h3><div class="setting-group">${settingRow('Auf dem Desktop anzeigen','Auch bei geschlossenem Fenster.','desktop',state.desktop)}${settingRow('Inhalte in Benachrichtigungen anzeigen','Titel, Personen und Repository-Namen im System-Banner.','preview',state.preview)}</div><div class="setting-inline">Aktualisieren alle<div class="segmented" role="group" aria-label="Aktualisierungsintervall">${[60,120,300].map(n=>`<button class="${state.interval===n?'on':''}" data-interval="${n}">${n/60} Min.</button>`).join('')}</div></div><p class="help">Bei GitHub-Limits verlängert sich das Abfrageintervall.</p><div class="settings-actions"><button class="btn primary" id="save">Einstellungen speichern ${icon('check')}</button><button class="btn" id="test-notification">Banner-Vorschau</button></div></div><div class="settings-section"><h3>GITHUB-KONTO</h3><div class="connection"><div class="avatar">a</div><div class="accountcopy"><strong>@alex</strong><small>Keine echte Verbindung · keine Zugangsdaten</small></div><span class="connection-status">DEMOKONTO</span></div><details><summary>Wie wird mein Konto in der nativen App verbunden?</summary><p>Ein Classic Token mit <code>notifications</code> liest deine Inbox. Optional erkennt <code>read:org</code> deine Teams. Für private Details kommt ein separater Fine-grained Token mit ausgewählten Repositories und reinen Leserechten hinzu. Beide Tokens liegen im System-Schlüsselbund – niemals in dieser Vorschau.</p></details></div><div class="settings-section"><h3>DATEN & DIAGNOSE</h3><p class="help">Hush ist lokal. Kein Telemetrie-Endpunkt, keine externen Schriftarten, keine Avatar-Downloads. Der native Client speichert höchstens 500 Ereignisse für 30 Tage im privaten Benutzerverzeichnis. Inhaltsdaten sind nicht verschlüsselt.</p><div class="note-box">Diese HTML-Datei ist ein interaktiver Design-Prototyp. Sie enthält ausschließlich erfundene Beispieldaten, verwendet keine Cookies und sendet keine Netzwerk-Anfragen. Die native Anwendung ist separat in Rust / egui implementiert.</div></div></div></section>`;
$$('[data-switch]').forEach(b=>b.onclick=()=>{const k=b.dataset.switch;if(k in state.rules)state.rules[k]=!state.rules[k];else state[k]=!state[k];b.setAttribute('aria-checked',String(k in state.rules?state.rules[k]:state[k]));});
$$('[data-interval]').forEach(b=>b.onclick=()=>{state.interval=+b.dataset.interval;$$('[data-interval]').forEach(x=>x.classList.toggle('on',x===b))});
$('#save').onclick=()=>{const value=$('#repos').value;const valid=value.split(/\s+/).filter(Boolean).every(s=>/^[a-zA-Z0-9_.-]+\/[a-zA-Z0-9_.-]+$/.test(s));if(!valid){toast('Bitte das Format organisation/repository verwenden.');return;}state.repos=value;toast('Nur in dieser Vorschau geändert. Keine echten Einstellungen gespeichert.')};$('#test-notification').onclick=showNotification;
}
function showNotification(){document.querySelector('.notification')?.remove();const node=document.createElement('div');node.className='notification';node.innerHTML=`<small>HUSH · SIMULIERTES SYSTEM-BANNER</small><button class="iconbutton" aria-label="Banner schließen">${icon('close')}</button><strong>${state.preview?'Review erhalten · atelier/desktop':'Neue Benachrichtigung'}</strong><p>${state.preview?'Lea hat „Refine the notification preferences“ freigegeben.':'Details in Hush öffnen.'}</p>`;document.body.append(node);node.querySelector('button').onclick=()=>node.remove();setTimeout(()=>node.remove(),7000)}
$$('.nav').forEach(b=>b.onclick=()=>{state.page=b.dataset.page||'inbox';state.kind=b.dataset.kind||null;state.selected=null;state.query='';render()});$('#pause').onclick=()=>{state.paused=!state.paused;render();toast(state.paused?'Demo: Desktop-Benachrichtigungen für 30 Minuten pausiert.':'Benachrichtigungen wieder aktiv.')};$('#refresh').onclick=()=>toast('Offline-Demo: kein Kontakt zu GitHub.');$('#theme').onclick=()=>document.body.classList.toggle('light');
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(state.page==='settings'){state.page='inbox';render()}$('#search')?.focus()}if(e.key==='Escape'){state.selected=null;render()}});render();
</script></body></html>
